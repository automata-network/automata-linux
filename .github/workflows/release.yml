name: Build and Release Packages

on:
  push:
    tags:
      # v0.2.0+ base-image releases are published by atakit-imgbuild push.
      # Keep this legacy package workflow off those image-release tags so it
      # does not overwrite release notes or attach stale package assets.
      - 'v0.0.*'
      - 'v0.1.*'
  workflow_dispatch:

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential

      - name: Update version in changelog
        run: |
          # Extract version from git tag (e.g., v0.1.2 -> 0.1.2) or default to 0.1.0
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            VERSION="0.1.0"
          fi
          echo "Building Debian package version: $VERSION"
          # Update the version in debian/changelog
          sed -i "s/^atakit ([^)]*)/atakit (${VERSION}-1)/" debian/changelog
          head -1 debian/changelog

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Move artifacts
        run: |
          mkdir -p dist
          mv ../atakit_*.deb dist/
          mv ../atakit_*.buildinfo dist/
          mv ../atakit_*.changes dist/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  build-macos:
    name: Build macOS Package (ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create macOS tarball
        run: |
          # Extract version from git tag (e.g., v0.1.2 -> 0.1.2) or default to 0.1.0
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            VERSION="0.1.0"
          fi
          echo "Building macOS package version: $VERSION"
          PKG_NAME="atakit-${VERSION}-macos-arm64"
          mkdir -p "${PKG_NAME}/bin"
          mkdir -p "${PKG_NAME}/share/atakit/scripts"
          mkdir -p "${PKG_NAME}/share/atakit/tools"
          mkdir -p "${PKG_NAME}/share/atakit/workload/config/cvm_agent"

          # Copy files
          cp atakit "${PKG_NAME}/bin/"
          cp scripts/*.sh "${PKG_NAME}/share/atakit/scripts/"
          cp tools/json_sig_tool.py "${PKG_NAME}/share/atakit/tools/"
          cp workload/docker-compose.yml "${PKG_NAME}/share/atakit/workload/"
          cp workload/config/cvm_agent/*.json "${PKG_NAME}/share/atakit/workload/config/cvm_agent/"
          cp workload/config/*.yml "${PKG_NAME}/share/atakit/workload/config/"
          cp workload/config/*.conf "${PKG_NAME}/share/atakit/workload/config/"
          cp README.md LICENSE "${PKG_NAME}/"

          # Create install script
          cat > "${PKG_NAME}/install.sh" << 'INSTALL_EOF'
          #!/bin/bash
          set -e
          PREFIX="${PREFIX:-/usr/local}"
          cp -r bin/* "${PREFIX}/bin/"
          mkdir -p "${PREFIX}/share/atakit"
          cp -r share/atakit/* "${PREFIX}/share/atakit/"
          echo "✅ atakit installed to ${PREFIX}"
          INSTALL_EOF
          chmod +x "${PKG_NAME}/install.sh"

          # Create tarball
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          mkdir -p dist
          mv "${PKG_NAME}.tar.gz" dist/

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/*.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-deb, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist/

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            ## atakit ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}

            This release contains the **atakit CLI** and **CVM disk images** for deploying Confidential VMs.

            ### 📦 Contents
            - **CLI Packages**: `.deb` (Ubuntu/Debian) and `.tar.gz` (macOS ARM64)
            - **Disk Images**: AWS (`.vmdk`), Azure (`.vhd.xz`), GCP (`.tar.gz`)
            - **Build Provenance**: `build-provenance.zip` (SLSA v1.0)
            - **Secure Boot Certs**: `secure-boot-certs.zip`

            ### Installation

            **Ubuntu/Debian:**
            ```bash
            # Set the release tag and extract version
            export RELEASE_TAG=${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
            export VERSION=${RELEASE_TAG#v}  # Remove leading 'v'

            # Download and install
            curl -LO "https://github.com/automata-network/automata-linux/releases/download/${RELEASE_TAG}/atakit_${VERSION}-1_all.deb"
            sudo dpkg -i atakit_${VERSION}-1_all.deb
            sudo apt-get install -f
            ```

            **macOS (ARM64 only via Homebrew):**
            ```bash
            brew tap automata-network/automata-linux https://github.com/automata-network/automata-linux.git
            brew install atakit
            ```

            ### Usage

            After installation:
            ```bash
            # Download disk image
            atakit get-disk aws       # or gcp, azure

            # Deploy to cloud
            atakit deploy-aws         # Deploy to AWS
            atakit deploy-gcp         # Deploy to GCP
            atakit deploy-azure       # Deploy to Azure

            # Verify build provenance (optional)
            atakit download-build-provenance
            atakit verify-build-provenance aws_disk.vmdk
            ```

            ### Verify Downloads
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-formula:
    name: Update Homebrew Formula
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get release asset info
        id: asset-info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}"

          # Get release info
          RELEASE_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")

          # Find the macOS ARM64 tarball asset
          ASSET_ID=$(echo "$RELEASE_INFO" | jq '.assets[] | select(.name | contains("macos-arm64")) | .id')
          ASSET_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | contains("macos-arm64")) | .browser_download_url')

          if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ]; then
            echo "Error: Could not find macOS ARM64 asset"
            exit 1
          fi

          # Download the asset to compute SHA256 (to /tmp to avoid committing to repo)
          TEMP_DIR=$(mktemp -d)
          curl -L -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID" \
            -o "$TEMP_DIR/macos-arm64.tar.gz"

          SHA256=$(sha256sum "$TEMP_DIR/macos-arm64.tar.gz" | awk '{print $1}')
          rm -rf "$TEMP_DIR"

          echo "asset_id=$ASSET_ID" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Found asset ID: $ASSET_ID"
          echo "SHA256: $SHA256"

      - name: Update formula
        run: |
          TAG="${{ steps.asset-info.outputs.tag }}"
          VERSION="${TAG#v}"  # Remove 'v' prefix
          SHA256="${{ steps.asset-info.outputs.sha256 }}"

          # Update version (URL uses #{version} interpolation so only version needs updating)
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" Formula/atakit.rb
          # Update SHA256
          sed -i "s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA256}\"/" Formula/atakit.rb

          echo "Updated formula:"
          cat Formula/atakit.rb

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/atakit.rb

          # Check if there are changes to commit (handles re-runs where formula hasn't changed)
          if git diff --staged --quiet; then
            echo "No changes to commit. Formula already up to date."
            exit 0
          fi

          git commit -m "chore: update Homebrew formula for ${{ steps.asset-info.outputs.tag }}"

          # Create branch and push (force push to handle re-runs)
          BRANCH="update-homebrew-formula-${{ steps.asset-info.outputs.tag }}"
          git checkout -b "$BRANCH"
          git push --force origin "$BRANCH"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            # Update existing PR
            gh pr edit "$EXISTING_PR" \
              --body "Automated PR to update the Homebrew formula for release ${{ steps.asset-info.outputs.tag }}.\n\n- SHA256: \`${{ steps.asset-info.outputs.sha256 }}\`"
            echo "Updated existing PR #$EXISTING_PR"
          else
            # Create new PR
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update Homebrew formula for ${{ steps.asset-info.outputs.tag }}" \
              --body "Automated PR to update the Homebrew formula for release ${{ steps.asset-info.outputs.tag }}.\n\n- SHA256: \`${{ steps.asset-info.outputs.sha256 }}\`"
          fi
